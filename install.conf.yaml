# Dotbot documentation: https://github.com/anishathalye/dotbot
# Tutorial: https://www.elliotdenolf.com/blog/bootstrap-your-dotfiles-with-dotbot
# To run: `./install`

# ============== Config ==============

- defaults:
    link:
      relink: true

- clean: ["~", "~/.claude/skills"]

- link:
    # Shell
    ~/.oh-my-zsh/custom/aliases.zsh: config/shell/.aliases.zsh
    ~/.oh-my-zsh/custom/functions.zsh: config/shell/.functions.zsh
    ~/.zshrc: config/shell/.zshrc
    # Terminal
    ~/com.googlecode.iterm2.plist: config/terminal/com.googlecode.iterm2.plist
    ~/.config/kitty/kitty.conf: config/terminal/kitty/kitty.conf
    ~/.config/kitty/launch.kitty-session: config/terminal/kitty/launch.kitty-session
    # Window manager
    ~/.yabairc: config/yabai/.yabairc
    # Git
    ~/.gitconfig: config/git/.gitconfig
    # Tasks ZSH plugin
    ~/.taskrc: config/task/.taskrc
    # ============== Other terminal items ==============
    # Claude Code
    # Skills are linked one at a time, never the whole skills/ directory, so
    # ~/.claude/skills can hold untracked machine-local skills alongside these.
    ~/.claude/CLAUDE.md: config/claude/CLAUDE.md
    ~/.claude/settings.json: config/claude/settings.json
    ~/.claude/skills/git-town-worktree:
      path: config/claude/skills/git-town-worktree
      create: true
    ~/.claude/skills/project-kickoff:
      path: config/claude/skills/project-kickoff
      create: true
    # ngrok
    ~/Library/Application Support/ngrok/ngrok.yml: config/ngrok/config.yaml

    # ============== Apps ==============
    # VS Code
    ~/Library/Application Support/Code/User/settings.json: config/vscode/settings.json
    ~/Library/Application Support/Code/User/keybindings.json: config/vscode/keybindings.json

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - command: cat config/vscode/extensions.txt | xargs -L 1 code --install-extension
      description: Installing VS Code extensions
      stdin: true
